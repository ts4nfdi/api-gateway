name: nerc

pagination:
  type: page
  first: 1

models:
  artefact: &artefact
    label: title
    iri: "@id"
    type: "@type"
    ontology: acronym
    ontologyIri: URI
    descriptions: description
    sourceUrl: "@id"
    created: released
    modified: modificationDate
    synonyms: alternative
    version: version
    shortForm: acronym
    status: status
    versionIRI: versionIRI
    accessRights: accessRights
    license: license
    contactPoint: contactPoint
    identifier: identifier
    creator: creator
    keywords: keyword
    landingPage: landingPage
    language: language
    publisher: publisher
    subject: subject
    accrualMethod: accrualMethod
    accrualPeriodicity: accrualPeriodicity
    bibliographicCitation: bibliographicCitation
    contributor: contributor
    coverage: coverage
    hasFormat: hasFormat
    rightsHolder: rightsHolder
    competencyQuestion: competencyQuestion
    semanticArtefactRelation: semanticArtefactRelation
    createdWith: createdWith
    wasGeneratedBy: wasGeneratedBy
    includedInDataCatalog: includedInDataCatalog
  search: &searchResult
    label: "sdo:name"
    iri: "@id"
    ontology: "sdo:inDefinedTermSet"
    ontologyIri: "sdo:inDefinedTermSet"
    descriptions: definition
    sourceUrl: links->ui
    type: "@type"
    obsolete: obsolete
    created: created
    modified: modified
endpoints:
  search:
    path: /search/content
    parameters:
      query:
        name: q
        type: string
    responseMapping:
      nestedJson: "member"
      totalCount: totalItems
      page: page
      <<: *searchResult
  resources:
    path: /artefacts?pagesize=10000
    responseMapping:
      nestedJson: "member"
      <<: *artefact

  concept_details:
    path: /artefacts/{artefact}/concepts/{resourceUri}
    parameters:
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *searchResult

  resource_details:
    path: /artefacts/{artefact}
    parameters:
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *artefact

  concepts:
    path: /artefacts/{artefact}/concepts
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: "member"
      totalCount: totalItems
      page: page
      <<: *searchResult

  properties:
    path: /artefacts/{artefact}/properties
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  property_details:
    path: /artefacts/{artefact}/properties/{resourceUri}
    responseMapping:
      <<: *searchResult

  schemes:
    path: /artefacts/{artefact}/schemes
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  scheme_details:
    path: /artefacts/{artefact}/schemes/{resourceUri}
    responseMapping:
      <<: *searchResult

  collections:
    path: /artefacts/{artefact}/collections
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  collection_details:
    path: /artefacts/{artefact}/collections/{resourceUri}
    responseMapping:
      <<: *searchResult