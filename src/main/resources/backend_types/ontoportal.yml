name: ontoportal

pagination:
  type: page
  first: 1

models:
  artefact: &artefact
    label: ontology->name
    iri: URI|uri
    type: "@type"
    descriptions: description
    ontology: ontology->acronym
    ontologyIri: URI|uri
    sourceUrl: ontology->links->ui
    created: released
    modified: modificationDate
    synonyms: alternative
    version: version
    shortForm: ontology->acronym
    status: status
    versionIRI: versionIRI
    license: hasLicense
    contactPoint: contact->email
    creator: hasCreator->email|hasCreator->name
    publisher: publisher->email|publisher->name
    rightsHolder: copyrightHolder->email|copyrightHolder->name
    contributor: hasContributor->email|hasContributor->name
    identifier: identifier
    keywords: keywords
    landingPage: homepage
    language: naturalLanguage
    subject: hasDomain
    accrualMethod: accrualMethod
    accrualPeriodicity: accrualPeriodicity
    bibliographicCitation: publication
    coverage: coverage
    hasFormat: hasFormat
    competencyQuestion: competencyQuestion
    wasGeneratedBy: wasGeneratedBy
    includedInDataCatalog: includedInDataCatalog
    semanticArtefactRelation: ontologyRelatedTo
    createdWith: usedOntologyEngineeringTool
    obsolete: obsolete
    accessRights: ontology->viewingRestriction
  term: &term
    label: prefLabel|label
    iri: "@id"
    synonyms: synonym
    descriptions: definition
    ontology: links->ontology
    ontologyIri: links->ontology
    sourceUrl: links->ui
    type: "@type"
    obsolete: obsolete
    created: created
    modified: modified

  searchResult: &searchResult
    <<: *term


endpoints:
  search:
    path: /search
    parameters:
      query:
        name: q
        type: string
      apiKey:
        name: apikey
        type: string
    responseMapping:
      nestedJson: collection
      collectionFilter: ontologies
      <<: *searchResult

  resources:
    path: /submissions?display_links=true&display_context=false&display=ontology,description,URI,released,modificationDate,alternative,version,status,versionIRI,hasLicense,contact,hasCreator,identifier,keyword,naturalLanguage,publisher,homepage,hasDomain,accrualMethod,accrualPeriodicity,publication,hasContributor,coverage,hasFormat,copyrightHolder,competencyQuestion,wasGeneratedBy,includedInDataCatalog,ontologyRelatedTo,usedOntologyEngineeringTool,keywords,obsolete
    parameters:
      apiKey:
        name: apikey
        type: string
      lang:
        name: lang
        type: string
        defaultValue: en
    responseMapping:
      nestedJson: collection
      <<: *artefact

  concepts:
    path: /ontologies/{artefact}/classes?display_links=true&display_context=false
    parameters:
      page:
        name: page
        type: string
      size:
        name: pagesize
        type: string
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      nestedJson: collection
      totalCount: totalCount
      page: page
      <<: *term

  properties:
    path: /ontologies/{artefact}/properties?display_links=true&display_context=false
    parameters:
      page:
        name: page
        type: string
      size:
        name: pagesize
        type: string
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      nestedJson: collection
      totalCount: totalCount
      page: page
      <<: *term

  concept_details:
    path: ontologies/{artefact}/classes/{resourceUri}
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term

  property_details:
    path: ontologies/{artefact}/properties/{resourceUri}
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term

  resource_details:
    path: ontologies/{artefact}/latest_submission?display=all
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *artefact

  individuals:
    path: /ontologies/{artefact}/instances?display_links=true&display_context=false
    parameters:
      page:
        name: page
        type: string
      size:
        name: pagesize
        type: string
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      nestedJson: collection
      totalCount: totalCount
      page: page
      <<: *term

  individual_details:
    path: ontologies/{artefact}/instances/{resourceUri}
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term

  schemes:
    path: ontologies/{artefact}/schemes
    parameters:
      page:
        name: page
        type: string
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term

  scheme_details:
    path: ontologies/{artefact}/schemes/{resourceUri}
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term

  collections:
    path: ontologies/{artefact}/collections
    parameters:
      page:
        name: page
        type: string
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term

  collection_details:
    path: ontologies/{artefact}/collections/{resourceUri}
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term

  concepts_roots:
    path: ontologies/{artefact}/classes/roots?display=prefLabel,definition,synonym,created,modified,obsolete,hasChildren
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term
      hasChildren: hasChildren

  concepts_children:
    path: ontologies/{artefact}/classes/{resourceUri}/children?display=prefLabel,definition,synonym,created,modified,obsolete,hasChildren
    parameters:
      page:
        name: page
        type: string
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      nestedJson: collection
      totalCount: totalCount
      page: page
      <<: *term
      hasChildren: hasChildren

  concept_tree:
    path: ontologies/{artefact}/classes/{resourceUri}/tree?display=prefLabel,definition,synonym,URI,created,modified,obsolete,hasChildren,children
    parameters:
      lang:
        name: lang
        type: string
        defaultValue: en
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *term
      hasChildren: hasChildren
      children: children
