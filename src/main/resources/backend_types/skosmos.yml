name: skosmos

pagination:
  type: offset
  first: 0

models:
  term: &term
    label: prefLabel|label
    iri: uri
    synonyms: altLabel
    descriptions: scopeNote
    ontology: vocab
    type: type
    hasChildren: hasDirectChildren

endpoints:
  search:
    path: /search?lang=en&fields=scopeNote
    parameters:
      query:
        name: query
        type: stringAsterisk
      childrenOf:
        name: children
        type: string
    responseMapping:
      nestedJson: results
      <<: *term

  resources:
    path: /vocabularies?lang=en
    responseMapping:
      nestedJson: vocabularies
      label: id
      iri: conceptschemes->uri|uri
      type: type
      ontology: id
      shortForm: id
      descriptions: title

  concepts:
    path: /{artefact}/label
    parameters:
      artefact:
        name: acronym
        type: string
    responseMapping:
      <<: *term

  concept_details:
    path: /{artefact}/label
    parameters:
      artefact:
        name: acronym
        type: string
      resourceUri:
        name: uri
        type: string
    responseMapping:
      <<: *term

  resource_details:
    path: /{artefact}
    responseMapping:
      label: id
      iri: conceptschemes->uri|uri
      type: type
      ontology: id
      descriptions: title
      shortForm: id

  concepts_roots:
    path: /{artefact}/topConcepts?lang=en
    caseInsensitive: false
    responseMapping:
      nestedJson: topconcepts
      <<: *term
      hasChildren: hasChildren

  concepts_children:
    path: /{artefact}/children?lang=en
    parameters:
      resourceUri:
        name: uri
        type: string
    caseInsensitive: false
    responseMapping:
      nestedJson: narrower
      <<: *term
      hasChildren: hasChildren
