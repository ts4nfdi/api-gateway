name: skosmos

pagination:
  type: offset
  first: 0

models:
  term: &term
    label: prefLabel|label
    iri: uri
    synonyms: altLabel
    descriptions: scopeNote
    ontology: vocab
    type: type
    hasChildren: hasDirectChildren
  graph: &graph
    label: "$.graph[?(@.uri=='{resourceUri}')].prefLabel[?(@.lang=='en')].value"
    iri: "$.graph[?(@.uri=='{resourceUri}')].uri"
    synonyms: "$.graph[?(@.uri=='{resourceUri}')].altLabel[?(@.lang=='en')].value"
    descriptions: "$.graph[?(@.uri in $.graph[?(@.uri=='{resourceUri}')]['skos:definition'][*].uri)]['http://www.w3.org/1999/02/22-rdf-syntax-ns#value'][?(@.lang=='en')].value"
    ontologyIri: "$.graph[?(@.uri=='{resourceUri}')].inScheme.uri"
    type: "$.graph[?(@.uri=='{resourceUri}')].type"
    hasChildren: "$.graph[?(@.uri=='{resourceUri}')].narrower"

endpoints:
  search:
    path: /search?fields=scopeNote
    parameters:
      query:
        name: query
        type: stringAsterisk
      allChildrenOf:
        name: parent
        type: string
        optional: true
      lang:
        name: lang
        type: string
        optional: true
    responseMapping:
      nestedJson: results
      <<: *term

  resources:
    path: /vocabularies?lang=en
    responseMapping:
      nestedJson: vocabularies
      label: id
      iri: conceptschemes->uri|uri
      type: type
      ontology: id
      shortForm: id
      descriptions: title

  concepts:
    path: /{artefact}/label
    caseInsensitive: false
    parameters:
      artefact:
        name: acronym
        type: string
    responseMapping:
      <<: *term

  concept_details:
    path: /{artefact}/data?format=application%2Fld%2Bjson
    caseInsensitive: false
    parameters:
      artefact:
        name: vocid
        type: string
      resourceUri:
        name: uri
        type: string
    responseMapping:
      <<: *graph

  resource_details:
    path: /{artefact}
    caseInsensitive: false
    responseMapping:
      label: id
      iri: conceptschemes->uri|uri
      type: type
      ontology: id
      descriptions: title
      shortForm: id

  concepts_roots:
    path: /{artefact}/topConcepts?lang=en
    caseInsensitive: false
    responseMapping:
      nestedJson: topconcepts
      <<: *term
      hasChildren: hasChildren

  concepts_children:
    path: /{artefact}/children?lang=en
    parameters:
      resourceUri:
        name: uri
        type: string
    caseInsensitive: false
    responseMapping:
      nestedJson: narrower
      <<: *term
      hasChildren: hasChildren
