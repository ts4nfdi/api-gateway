name: mod

pagination:
  type: page
  first: 1

models:
  search: &searchResult
    label: prefLabel
    iri: "@id"
    synonyms: synonym
    ontology: links->ontology
    descriptions: definition
    sourceUrl: links->ui
    type: "@type"
    obsolete: obsolete
    created: created
    modified: modified

endpoints:
  search:
    path: /search
    parameters:
      query:
        name: query
        type: string
    responseMapping:
      nestedJson: member
      <<: *searchResult
  resources:
    path: /artefacts?pagesize=10000
    responseMapping:
      nestedJson: member
      label: title
      iri: "@id"
      type: "@type"
      ontology: acronym
      ontologyIri: URI
      descriptions: description
      sourceUrl: "@id"
      created: released
      modified: modificationDate
      synonyms: alternative
      version: version
      shortForm: acronym
      status: status
      versionIRI: versionIRI
      accessRights: accessRights
      license: license
      contactPoint: contactPoint
      identifier: identifier
      creator: creator
      keywords: keyword
      landingPage: landingPage
      language: language
      publisher: publisher
      subject: subject
      accrualMethod: accrualMethod
      accrualPeriodicity: accrualPeriodicity
      bibliographicCitation: bibliographicCitation
      contributor: contributor
      coverage: coverage
      hasFormat: hasFormat
      rightsHolder: rightsHolder
      competencyQuestion: competencyQuestion
      semanticArtefactRelation: semanticArtefactRelation
      createdWith: createdWith
      wasGeneratedBy: wasGeneratedBy
      includedInDataCatalog: includedInDataCatalog
  concept_details:
    path: ontologies/{artefact}/classes/{resourceUri}
    parameters:
      apiKey:
        name: apikey
        type: string
    responseMapping:
      <<: *searchResult
  resource_details:
    path: ontologies/{artefact}
    parameters:
      apiKey:
        name: apikey
        type: string
    responseMapping:
      nestedJson: ""
      label: title
      iri: "@id"
      type: "@type"
      ontology: acronym
      ontologyIri: URI|uri
      descriptions: description
      sourceUrl: "@id"
      created: released
      modified: modificationDate
      synonyms: alternative
      version: version
      shortForm: acronym
      status: status
      versionIRI: versionIRI
      accessRights: accessRights
      license: license
      contactPoint: contactPoint
      creator: creator
      identifier: identifier
      keywords: keyword
      landingPage: landingPage
      language: language
      publisher: publisher
      subject: subject
      accrualMethod: accrualMethod
      accrualPeriodicity: accrualPeriodicity
      bibliographicCitation: bibliographicCitation
      contributor: contributor
      coverage: coverage
      hasFormat: hasFormat
      rightsHolder: rightsHolder
      competencyQuestion: competencyQuestion
      semanticArtefactRelation: semanticArtefactRelation
      createdWith: createdWith
      wasGeneratedBy: wasGeneratedBy
      includedInDataCatalog: includedInDataCatalog

  concepts:
    path: /ontologies/{artefact}/classes
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  properties:
    path: /ontologies/{artefact}/properties
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  property_details:
    path: ontologies/{artefact}/properties/{resourceUri}
    responseMapping:
      <<: *searchResult

  individuals:
    path: /ontologies/{artefact}/instances
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  individual_details:
    path: ontologies/{artefact}/instances/{resourceUri}
    responseMapping:
      <<: *searchResult

  schemes:
    path: ontologies/{artefact}/schemes
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  scheme_details:
    path: ontologies/{artefact}/schemes/{resourceUri}
    responseMapping:
      <<: *searchResult

  collections:
    path: ontologies/{artefact}/collections
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: member
      totalCount: totalItems
      page: page
      <<: *searchResult

  collection_details:
    path: ontologies/{artefact}/collections/{resourceUri}
    responseMapping:
      <<: *searchResult

