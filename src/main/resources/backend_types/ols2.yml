name: ols2

pagination:
  type: page
  first: 0

models:
  artefact: &artefact
    label: title|http://www.w3.org/2000/01/rdf-schema#label|label
    iri: uri|iri
    ontology: ontologyId
    synonyms: label
    descriptions: definition|description
    shortForm: ontologyId
    type: type
    sourceUrl: linkedEntities->self->source
    obsolete: isObsolete
    modified: loaded
    ontologyIri: uri|iri
    version: http://www.w3.org/2002/07/owl#versionInfo
  term: &term
    label: label
    iri: iri
    ontology: ontologyId
    synonyms: synonym|synonym->value
    descriptions: definition|description|definition->value|description->value
    shortForm: shortForm
    type: type
    sourceUrl: linkedEntities->self->source
    obsolete: isObsolete
    ontologyIri: ontologyIri
    modified: loaded
    annotations->depiction: http://xmlns.com/foaf/0.1/depiction

endpoints:
  search:
    path: /v2/entities
    parameters:
      query:
        name: search
        type: string
      hierarchicalParent:
        name: hierarchicalParent
        type: string
        optional: true
      hierarchicalAncestor:
        name: hierarchicalAncestor
        type: string
        optional: true
      lang:
        name: lang
        type: string
        default: en
      size:
        name: size
        type: integer
        optional: true
      page:
        name: page
        type: integer
        optional: true
    responseMapping:
      collectionFilter: ontologyId
      nestedJson: elements
      <<: *term

  resources:
    path: /v2/ontologies
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      page: page
      totalCount: totalElements
      <<: *artefact

  concepts:
    path: /v2/ontologies/{artefact}/classes
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      totalCount: totalElements
      page: page
      <<: *term

  properties:
    path: /v2/ontologies/{artefact}/properties
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      totalCount: totalElements
      page: page
      <<: *term

  concept_details:
    path: /v2/ontologies/{artefact}/classes
    parameters:
      resourceUri:
        name: iri
        type: string
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      <<: *term

  property_details:
    path: /v2/ontologies/{artefact}/properties
    parameters:
      resourceUri:
        name: iri
        type: string
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      <<: *term

  resource_details:
    path: /v2/ontologies/{artefact}
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: ""
      key: ""
      <<: *artefact

  individuals:
    path: /v2/ontologies/{artefact}/individuals
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      totalCount: totalElements
      page: page
      <<: *term

  individual_details:
    path: /v2/ontologies/{artefact}/individuals
    parameters:
      resourceUri:
        name: iri
        type: string
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      <<: *term

  concepts_roots:
    path: /v2/ontologies/{artefact}/classes?hasDirectParents=false&includeObsoleteEntities=false
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      <<: *term
      hasChildren: hasDirectChildren

  concepts_children:
    path: /v2/ontologies/{artefact}/classes/{resourceUri}/hierarchicalChildren?includeObsoleteEntities=false
    caseInsensitive: false
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      totalCount: totalElements
      page: page
      <<: *term
      hasChildren: hasDirectChildren

  concept_tree:
    path: /v2/ontologies/{artefact}/classes/{resourceUri}/hierarchicalAncestors
    caseInsensitive: false
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
      lang:
        name: lang
        type: string
        default: en
    responseMapping:
      nestedJson: elements
      totalCount: totalElements
      page: page
      <<: *term
      hasChildren: hasDirectChildren

  suggest:
    path: /select?fieldList=iri&fieldList=label&fieldList=ontology_name
    pagination:
      type: offset
      first: 0
    parameters:
      query:
        name: q
        type: string
      hierarchicalParent:
        name: childrenOf
        type: string
        optional: true
      hierarchicalAncestor:
        name: allChildrenOf
        type: string
        optional: true
      lang:
        name: lang
        type: string
        optional: true
      size:
        name: rows
        type: integer
        optional: true
      offset:
        name: start
        type: integer
        optional: true
    responseMapping:
      nestedJson: response
      collectionFilter: ontology
      key: docs
      iri: iri
      label: label
      ontologyIri: ontology_name
      totalCount: response->numFound
      page: page->start
