name: ols

pagination:
  type: page
  first: 0

models:
  artefact: &artefact
    label: config->title|ontologyId
    iri: config->id
    type: type
    descriptions: config->description
    ontology: ontologyId
    sourceUrl: _links->self->href
    version: config->version
    synonyms: synonym
    shortForm: ontologyId

  term: &term
    label: label
    iri: iri
    ontology: ontology_name
    synonyms: synonyms
    descriptions: description
    shortForm: short_form
    sourceUrl: _links->self->href
    type: type
    obsolete: is_obsolete
    ontologyIri: ontology_iri
    annotations: annotation

endpoints:
  search:
    path: search
    parameters:
      query:
        name: q
        type: string
    responseMapping:
      nestedJson: response
      collectionFilter: ontology
      key: docs
      label: label
      iri: iri
      ontology: ontology_name
      synonyms: synonym
      descriptions: description
      shortForm: short_form
      annotations: annotation
      type: type

  resources:
    path: ontologies?size=10000
    responseMapping:
      nestedJson: _embedded
      key: ontologies
      <<: *artefact

  concepts:
    path: terms?size=50
    parameters:
      resourceUri:
        name: id
        type: string
      page:
        name: page
        type: string
    caseInsensitive: false
    responseMapping:
      nestedJson: _embedded
      page: page->number
      totalCount: page->totalElements
      key: terms
      <<: *term

  properties:
    path: properties?size=50
    parameters:
      resourceUri:
        name: id
        type: string
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: _embedded
      page: page->number
      totalCount: page->totalElements
      key: properties
      <<: *term

  concept_details:
    path: ontologies/{artefact}/terms
    parameters:
      resourceUri:
        name: iri
        type: string
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term

  property_details:
    path: ontologies/{artefact}/properties
    parameters:
      resourceUri:
        name: iri
        type: string
    responseMapping:
      nestedJson: _embedded
      key: properties
      <<: *term

  resource_details:
    path: ontologies/{artefact}
    responseMapping:
      nestedJson: ""
      key: ""
      <<: *artefact

  individuals:
    path: /ontologies/{artefact}/individuals?size=50
    parameters:
      page:
        name: page
        type: string
    responseMapping:
      nestedJson: _embedded
      page: page->number
      totalCount: page->totalElements
      key: individuals
      <<: *term

  individual_details:
    path: ontologies/{artefact}/individuals
    parameters:
      resourceUri:
        name: iri
        type: string
    responseMapping:
      nestedJson: _embedded
      key: individuals
      <<: *term

  concepts_roots:
    path: ontologies/{artefact}/terms/roots?size=1000
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term
      hasChildren: has_children

  concepts_children:
    path: ontologies/{artefact}/terms/{resourceUri}/hierarchicalChildren
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term
      hasChildren: has_children

  concept_tree:
    path: ontologies/{artefact}/terms/{resourceUri}/hierarchicalAncestors
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term
      hasChildren: has_children

  suggest:
    path: /select
    parameters:
      query:
        name: q
        type: string
      size:
        name: rows
        type: string
      offset:
        name: start
        type: string
    responseMapping:
      nestedJson: response
      collectionFilter: ontology
      key: docs
      iri: iri
      label: autosuggest
      totalCount: response->numFound
      page: page->start
