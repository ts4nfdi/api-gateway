name: ols

pagination:
  type: page
  first: 0

models:
  artefact: &artefact
    label: config->title|ontologyId
    iri: config->id
    type: type
    descriptions: config->description
    ontology: ontologyId
    sourceUrl: _links->self->href
    version: config->version
    synonyms: synonym
    shortForm: ontologyId

  term: &term
    label: label
    iri: iri
    ontology: ontology_name
    synonyms: synonyms
    descriptions: description
    shortForm: short_form
    sourceUrl: _links->self->href
    type: type
    obsolete: is_obsolete
    ontologyIri: ontology_iri
    annotations: annotation

endpoints:
  search:
    path: search
    parameters:
      query:
        name: q
        type: string
      hierarchicalParent:
        name: childrenOf
        type: string
        optional: true
      hierarchicalAncestor:
        name: allChildrenOf
        type: string
        optional: true
      lang:
        name: lang
        type: string
        optional: true
      size:
        name: rows
        type: integer
        optional: true
      page:
        name: start
        type: integer
        optional: true
    responseMapping:
      nestedJson: response
      collectionFilter: ontology
      key: docs
      label: label
      iri: iri
      ontology: ontology_name
      synonyms: synonym
      descriptions: description
      shortForm: short_form
      annotations: annotation
      type: type

  resources:
    path: ontologies
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
    responseMapping:
      nestedJson: _embedded
      key: ontologies
      <<: *artefact
  concepts:
    path: terms
    parameters:
      resourceUri:
        name: id
        type: string
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
    caseInsensitive: false
    responseMapping:
      nestedJson: _embedded
      page: page->number
      totalCount: page->totalElements
      key: terms
      <<: *term

  properties:
    path: properties
    parameters:
      resourceUri:
        name: id
        type: string
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
    responseMapping:
      nestedJson: _embedded
      page: page->number
      totalCount: page->totalElements
      key: properties
      <<: *term

  concept_details:
    path: ontologies/{artefact}/terms
    parameters:
      resourceUri:
        name: iri
        type: string
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term

  property_details:
    path: ontologies/{artefact}/properties
    parameters:
      resourceUri:
        name: iri
        type: string
    responseMapping:
      nestedJson: _embedded
      key: properties
      <<: *term

  resource_details:
    path: ontologies/{artefact}
    responseMapping:
      nestedJson: ""
      key: ""
      <<: *artefact

  individuals:
    path: /ontologies/{artefact}/individuals
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
    responseMapping:
      nestedJson: _embedded
      page: page->number
      totalCount: page->totalElements
      key: individuals
      <<: *term

  individual_details:
    path: ontologies/{artefact}/individuals
    parameters:
      resourceUri:
        name: iri
        type: string
    responseMapping:
      nestedJson: _embedded
      key: individuals
      <<: *term

  concepts_roots:
    path: ontologies/{artefact}/terms/roots
    parameters:
      page:
        name: page
        type: integer
        optional: true
      size:
        name: size
        type: integer
        default: 50
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term
      hasChildren: has_children

  concepts_children:
    path: ontologies/{artefact}/terms/{resourceUri}/hierarchicalChildren
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term
      hasChildren: has_children

  concept_tree:
    path: ontologies/{artefact}/terms/{resourceUri}/hierarchicalAncestors
    responseMapping:
      nestedJson: _embedded
      key: terms
      <<: *term
      hasChildren: has_children

  suggest:
    path: /select
    pagination:
      type: offset
      first: 0
    parameters:
      query:
        name: q
        type: string
      hierarchicalParent:
        name: childrenOf
        type: string
        optional: true
      hierarchicalAncestor:
        name: allChildrenOf
        type: string
        optional: true
      lang:
        name: lang
        type: string
        optional: true
      size:
        name: rows
        type: integer
        optional: true
      page:
        name: start
        type: integer
        optional: true
    responseMapping:
      nestedJson: response
      collectionFilter: ontology
      key: docs
      iri: iri
      label: autosuggest
      totalCount: response->numFound
      page: page->start
