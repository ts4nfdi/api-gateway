search:
  ontologies:
    - name: Bioportal
      fields:
        - iri
        - label
        - source
        - synonym
        - ontology
      url: "https://data.biodivportal.gfbio.dev/search?q=%s&apikey=${BIODIVPORTAL_API_KEY}"
    - name: OLS
      fields:
        - iri
        - label
        - source
        - synonym
        - ontology
      url: "https://www.ebi.ac.uk/ols/api/search?q=%s"
